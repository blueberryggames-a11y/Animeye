<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniStream</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c14; --bg2: #0d1220;
  --surface: #161e30; --surface2: #1e2a40;
  --border: #1f2d45; --accent: #e63946;
  --text: #e8eaf0; --text2: #8a9bb5; --text3: #4a5568;
  --r: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--text); font-family:sans-serif; min-height:100vh; overflow-x:hidden; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }

/* NAV */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(8,12,20,.95); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  height:56px; padding:0 20px;
  display:flex; align-items:center; gap:16px;
}
.logo {
  font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700;
  letter-spacing:2px; text-decoration:none; color:var(--text);
  display:flex; align-items:center; gap:6px; flex-shrink:0;
}
.logo em { color:var(--accent); font-style:normal; }
.dot { width:6px; height:6px; background:var(--accent); border-radius:50%; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.5)} }
.nbtn {
  font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--text2); background:none; border:none;
  padding:6px 12px; border-radius:var(--r); cursor:pointer; transition:all .2s;
}
.nbtn:hover,.nbtn.on { color:var(--text); background:var(--surface); }
.srow { display:flex; margin-left:auto; }
.srow input {
  background:var(--surface); border:1px solid var(--border); border-right:none;
  border-radius:var(--r) 0 0 var(--r); padding:7px 14px;
  color:var(--text); font-size:13px; outline:none; width:200px; transition:border-color .2s;
}
.srow input:focus { border-color:var(--accent); }
.srow input::placeholder { color:var(--text3); }
.srow button {
  background:var(--accent); border:none; border-radius:0 var(--r) var(--r) 0;
  padding:7px 14px; color:#fff; cursor:pointer; font-size:14px; transition:background .2s;
}
.srow button:hover { background:#ff6b6b; }

/* PAGES */
main { margin-top:56px; }
.page { display:none; }
.page.on { display:block; }

/* HERO */
#hero {
  height:420px; position:relative; overflow:hidden;
  display:flex; align-items:flex-end; padding:36px;
}
#hbg { position:absolute; inset:0; background:linear-gradient(135deg,#0d1220,#1a0a1e,#080c14); }
#himg {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; opacity:0; transition:opacity 1.2s;
}
#himg.in { opacity:.22; }
#hgrad {
  position:absolute; inset:0;
  background:linear-gradient(to right,rgba(8,12,20,.98) 38%,transparent 75%),
             linear-gradient(to top,var(--bg) 0%,transparent 45%);
}
#hcon { position:relative; z-index:2; max-width:500px; }
#hlabel {
  font-family:'Space Mono',monospace; font-size:10px; letter-spacing:3px;
  color:var(--accent); text-transform:uppercase; margin-bottom:10px;
  display:flex; align-items:center; gap:8px;
}
#hlabel::before { content:''; width:20px; height:1px; background:var(--accent); }
#htitle { font-family:'Rajdhani',sans-serif; font-size:clamp(24px,3.5vw,44px); font-weight:700; line-height:1.1; margin-bottom:10px; }
#hmeta { display:flex; gap:14px; font-family:'Space Mono',monospace; font-size:11px; color:var(--text2); margin-bottom:14px; }
#hsyn {
  font-size:13px; color:var(--text2); line-height:1.7; margin-bottom:20px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.hbtns { display:flex; gap:10px; }
.btnp {
  background:var(--accent); color:#fff; border:none; padding:10px 22px;
  border-radius:var(--r); font-family:'Rajdhani',sans-serif; font-weight:700;
  font-size:13px; letter-spacing:1px; cursor:pointer; transition:all .2s;
}
.btnp:hover { background:#ff6b6b; transform:translateY(-1px); }
.btns {
  background:rgba(255,255,255,.05); color:var(--text); border:1px solid var(--border);
  padding:10px 22px; border-radius:var(--r); font-family:'Rajdhani',sans-serif; font-weight:700;
  font-size:13px; letter-spacing:1px; cursor:pointer; transition:all .2s;
}
.btns:hover { background:var(--surface2); border-color:var(--text2); }

/* SECTION */
.sec { padding:28px 36px; }
.sec-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.stitle {
  font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
}
.stitle::before { content:''; width:3px; height:16px; background:var(--accent); border-radius:2px; }
.seeall { font-family:'Space Mono',monospace; font-size:11px; color:var(--text2); cursor:pointer; letter-spacing:1px; }
.seeall:hover { color:var(--accent); }

/* CARD GRID */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
.card {
  cursor:pointer; border-radius:var(--r); overflow:hidden;
  background:var(--surface); border:1px solid var(--border);
  transition:all .25s; position:relative; aspect-ratio:2/3;
}
.card:hover { transform:translateY(-4px); border-color:var(--accent); box-shadow:0 12px 28px rgba(230,57,70,.2); }
.card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
.card:hover img { transform:scale(1.06); }
.cover {
  position:absolute; inset:0;
  background:linear-gradient(to top,rgba(8,12,20,.95) 0%,transparent 55%);
  display:flex; flex-direction:column; justify-content:flex-end; padding:10px;
}
.ctitle {
  font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600; line-height:1.3; margin-bottom:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.cep { font-family:'Space Mono',monospace; font-size:9px; color:var(--accent); }
.cbadge {
  position:absolute; top:7px; left:7px; background:var(--accent);
  color:#fff; font-family:'Space Mono',monospace; font-size:8px;
  padding:2px 6px; border-radius:3px; letter-spacing:1px;
}
.skel {
  border-radius:var(--r); aspect-ratio:2/3;
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%; animation:shim 1.5s infinite;
}
@keyframes shim { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* WATCH LAYOUT */
#wp { padding:20px 28px; }
.wlayout { display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }

/* PLAYER */
#pbox {
  background:#000; border-radius:var(--r); overflow:hidden;
  aspect-ratio:16/9; position:relative; border:1px solid var(--border);
}
#pbox iframe { width:100%; height:100%; border:none; display:block; }
#pmsg {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px;
  background:var(--bg2); color:var(--text2); text-align:center; padding:24px;
}
#pmsg .pi { font-size:52px; opacity:.2; }
#pmsg p { font-size:13px; max-width:280px; line-height:1.6; }
#pmsg small { font-family:'Space Mono',monospace; font-size:10px; color:var(--text3); }

.winfo { margin-top:14px; }
#wtitle { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; margin-bottom:8px; }
.wmeta { display:flex; gap:14px; font-family:'Space Mono',monospace; font-size:11px; color:var(--text2); margin-bottom:10px; }
#wdesc { font-size:13px; color:var(--text2); line-height:1.75; border-left:2px solid var(--border); padding-left:12px; }
#wact { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }

/* QUALITY BAR */
#qbar { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.qlabel { font-family:'Space Mono',monospace; font-size:10px; color:var(--text3); letter-spacing:1px; }
.qbtn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--text2); padding:5px 12px; border-radius:var(--r);
  font-family:'Space Mono',monospace; font-size:11px; cursor:pointer; transition:all .2s;
}
.qbtn:hover { border-color:var(--accent); color:var(--accent); }
.qbtn.on { background:var(--accent); border-color:var(--accent); color:#fff; }

/* EPISODE SIDEBAR */
.epside {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); overflow:hidden;
  max-height:calc(100vh - 80px); display:flex; flex-direction:column;
  position:sticky; top:68px;
}
.ephead {
  padding:12px 14px; border-bottom:1px solid var(--border);
  background:var(--bg2); display:flex; align-items:center; justify-content:space-between;
  font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700; letter-spacing:1px;
}
.epcnt { font-family:'Space Mono',monospace; font-size:10px; color:var(--text2); }
.pgctrl {
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-bottom:1px solid var(--border); background:var(--bg);
}
.pgbtn {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); padding:3px 9px; border-radius:4px;
  font-size:11px; font-family:'Space Mono',monospace; cursor:pointer; transition:all .15s;
}
.pgbtn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
.pgbtn:disabled { opacity:.3; cursor:default; }
.pglabel { font-family:'Space Mono',monospace; font-size:10px; color:var(--text3); flex:1; text-align:center; }
.epscroll { overflow-y:auto; flex:1; }
.epitem {
  padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--border);
  transition:background .15s; display:flex; align-items:center; gap:10px;
}
.epitem:hover { background:var(--surface2); }
.epitem.on { background:rgba(230,57,70,.12); border-left:2px solid var(--accent); }
.epnum { font-family:'Space Mono',monospace; font-size:10px; color:var(--text3); min-width:30px; }
.epitem.on .epnum { color:var(--accent); }
.epname { font-size:12px; font-family:'Rajdhani',sans-serif; font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.epthumb { width:56px; height:34px; object-fit:cover; border-radius:3px; opacity:.55; flex-shrink:0; }
.epload { padding:24px; text-align:center; color:var(--text3); font-size:12px; font-family:'Space Mono',monospace; }

/* SPINNER */
.spin { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:rot .7s linear infinite; }
@keyframes rot { to{transform:rotate(360deg)} }
.loading { display:flex; justify-content:center; align-items:center; padding:48px; gap:10px; color:var(--text2); font-family:'Space Mono',monospace; font-size:12px; }

/* TOAST */
#toast {
  position:fixed; bottom:20px; right:20px; z-index:9999;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r); padding:10px 18px;
  font-family:'Space Mono',monospace; font-size:11px;
  transform:translateY(60px); opacity:0; transition:all .3s; max-width:300px;
}
#toast.on { transform:translateY(0); opacity:1; }
#toast.err { border-color:var(--accent); color:var(--accent); }
#toast.ok { border-color:#4ade80; color:#4ade80; }

/* FOOTER */
footer {
  border-top:1px solid var(--border); padding:20px 36px;
  display:flex; justify-content:space-between;
  font-family:'Space Mono',monospace; font-size:10px; color:var(--text3);
}
footer a { color:var(--text2); text-decoration:none; }
footer a:hover { color:var(--accent); }

@media(max-width:860px) {
  .wlayout { grid-template-columns:1fr; }
  .epside { max-height:380px; position:static; }
  .sec { padding:20px 16px; }
  #wp { padding:14px; }
  nav { padding:0 14px; gap:8px; }
  #hero { height:340px; padding:24px 20px; }
  .grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
}
</style>
</head>
<body>

<nav>
  <a class="logo" href="#" onclick="goHome();return false;">ANI<em>STREAM</em><div class="dot"></div></a>
  <button class="nbtn on" id="nb-home" onclick="goHome()">Home</button>
  <button class="nbtn" id="nb-rec" onclick="showRecent()">Recent</button>
  <div class="srow">
    <input id="si" type="text" placeholder="Search anime…" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">⌕</button>
  </div>
</nav>

<main>

<!-- HOME -->
<div id="home-page" class="page on">
  <div id="hero">
    <div id="hbg"></div>
    <img id="himg" src="" alt="">
    <div id="hgrad"></div>
    <div id="hcon">
      <div id="hlabel">FEATURED</div>
      <div id="htitle">Loading…</div>
      <div id="hmeta"><span>⭐ —</span><span>📺 —</span></div>
      <div id="hsyn">Fetching latest anime…</div>
      <div class="hbtns">
        <button class="btnp" onclick="heroWatch()">▶ Watch Now</button>
        <button class="btns" onclick="heroWatch()">ℹ Episodes</button>
      </div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-head">
      <div class="stitle">Recently Added</div>
      <span class="seeall" onclick="showRecent()">See all →</span>
    </div>
    <div class="grid" id="home-grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
    </div>
  </div>
</div>

<!-- SEARCH -->
<div id="search-page" class="page">
  <div class="sec">
    <div class="sec-head"><div class="stitle" id="slabel">Results</div></div>
    <div class="grid" id="search-grid"></div>
  </div>
</div>

<!-- WATCH -->
<div id="watch-page" class="page" id="wp">
  <div style="padding:20px 28px">
    <div class="wlayout">
      <div>
        <div id="pbox">
          <div id="pmsg">
            <div class="pi">▶</div>
            <p>Pick an episode to start watching.</p>
            <small>Videos load directly via Kwik embed.</small>
          </div>
        </div>
        <div id="qbar" style="display:none">
          <span class="qlabel">QUALITY:</span>
        </div>
        <div class="winfo">
          <div id="wtitle">—</div>
          <div class="wmeta" id="wmeta"></div>
          <div id="wdesc"></div>
          <div id="wact"></div>
        </div>
      </div>

      <div class="epside">
        <div class="ephead">Episodes <span class="epcnt" id="epcnt">—</span></div>
        <div class="pgctrl">
          <button class="pgbtn" id="pgprev" onclick="epPage(-1)" disabled>‹</button>
          <span class="pglabel" id="pglbl">Page 1</span>
          <button class="pgbtn" id="pgnext" onclick="epPage(1)">›</button>
        </div>
        <div class="epscroll" id="eplist">
          <div class="epload">Loading…</div>
        </div>
      </div>
    </div>
  </div>
</div>

</main>

<div id="toast"></div>

<footer>
  <span>AniStream — data via AnimePahe API</span>
  <a href="https://animepahe.ru" target="_blank">AnimePahe</a>
</footer>

<script>
const PROXY = 'https://api.allorigins.win/raw?url=';
const BASE  = 'https://animepahe.ru';

let heroAnime = null, curAnime = null;
let curEps = [], curPage = 1, totalPages = 1;
let curEpIdx = null, curSources = [];

// ── Fetch via CORS proxy ──────────────────
async function api(path) {
  const r = await fetch(PROXY + encodeURIComponent(BASE + path));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function pImg(url) {
  if (!url) return '';
  if (url.startsWith('data:')) return url;
  if (url.startsWith('/')) return BASE + url;
  return PROXY + encodeURIComponent(url);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function dHtml(s) {
  const t = document.createElement('textarea'); t.innerHTML = s; return t.value;
}

// ── Toast ─────────────────────────────────
let _tt;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'on ' + type;
  clearTimeout(_tt); _tt = setTimeout(() => el.className='', 3500);
}

// ── Page routing ─────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function setNav(id) {
  document.querySelectorAll('.nbtn').forEach(b => b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function goHome() { showPage('home-page'); setNav('nb-home'); }

// ── Hero ──────────────────────────────────
function setHero(a) {
  heroAnime = a;
  const title = a.anime_title || a.title || 'Unknown';
  document.getElementById('htitle').textContent = title;
  document.getElementById('hsyn').textContent =
    'Episode ' + (a.episode||'?') + ' now available — click Watch Now to stream.';
  document.getElementById('hmeta').innerHTML =
    `<span>⭐ ${a.score||'?'}</span><span>📺 EP ${a.episode||'?'}</span><span>🎬 ${a.type||'TV'}</span>`;
  const img = document.getElementById('himg');
  img.src = pImg(a.anime_cover || a.poster || '');
  img.onload = () => img.classList.add('in');
}
function heroWatch() {
  if (heroAnime) openAnime(heroAnime.anime_session||heroAnime.session, heroAnime.anime_title||heroAnime.title);
}

// ── Grid ─────────────────────────────────
function renderGrid(gid, items) {
  const g = document.getElementById(gid);
  if (!items||!items.length) {
    g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text2);font-family:Space Mono,monospace;font-size:12px;">No results.</div>';
    return;
  }
  g.innerHTML = items.map(a => {
    const session = esc(a.anime_session||a.session||'');
    const title   = esc(a.anime_title||a.title||'Unknown');
    const ep      = a.episode ? 'EP '+a.episode : '';
    const cover   = pImg(a.anime_cover||a.poster||'');
    return `<div class="card" onclick="openAnime('${session}','${title}')">
      <img src="${cover}" alt="${title}" loading="lazy" onerror="this.src='https://placehold.co/300x450/111827/4a5568?text=?'">
      <div class="cover">
        <div class="ctitle">${title}</div>
        ${ep?`<div class="cep">${ep}</div>`:''}
      </div>
      ${ep?'<div class="cbadge">NEW</div>':''}
    </div>`;
  }).join('');
}

// ── Recent / Home ─────────────────────────
async function loadRecent(page=1) {
  try {
    const d = await api('/api?m=airing&page='+page);
    renderGrid('home-grid', d.data||[]);
    if ((d.data||[]).length && !heroAnime) setHero(d.data[0]);
  } catch(e) {
    document.getElementById('home-grid').innerHTML =
      '<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text2);font-family:monospace;font-size:12px;">Could not load — CORS proxy may be down.<br><br><a href="https://animepahe.ru" target="_blank" style="color:var(--accent)">Open AnimePahe directly</a></div>';
    toast('Proxy error — check console', 'err');
  }
}
async function showRecent() {
  showPage('home-page'); setNav('nb-rec');
  heroAnime = null;
  document.getElementById('home-grid').innerHTML = Array(10).fill('<div class="skel"></div>').join('');
  await loadRecent(1);
}

// ── Search ────────────────────────────────
async function doSearch() {
  const q = document.getElementById('si').value.trim();
  if (!q) return;
  showPage('search-page');
  document.getElementById('slabel').textContent = 'Results for "'+q+'"';
  document.getElementById('search-grid').innerHTML = '<div class="loading"><div class="spin"></div> Searching…</div>';
  try {
    const d = await api('/api?m=search&q='+encodeURIComponent(q));
    renderGrid('search-grid', d.data||[]);
  } catch(e) {
    toast('Search failed', 'err');
  }
}

// ── Open Anime ────────────────────────────
async function openAnime(session, title) {
  if (!session) { toast('No session', 'err'); return; }
  curAnime = { session, title };
  curPage = 1; curEpIdx = null; curSources = [];

  showPage('watch-page');
  clearPlayer();
  document.getElementById('wtitle').textContent = dHtml(title);
  document.getElementById('wmeta').innerHTML = '';
  document.getElementById('wdesc').textContent = '';
  document.getElementById('wact').innerHTML = '';
  document.getElementById('qbar').style.display = 'none';
  document.getElementById('eplist').innerHTML = '<div class="epload"><div class="spin"></div></div>';
  document.getElementById('epcnt').textContent = '…';

  await loadEps(session, 1);
}

function clearPlayer() {
  const box = document.getElementById('pbox');
  const old = box.querySelector('iframe');
  if (old) old.remove();
  document.getElementById('pmsg').style.display = 'flex';
}

// ── Episodes ──────────────────────────────
async function loadEps(session, page) {
  document.getElementById('eplist').innerHTML = '<div class="epload"><div class="spin"></div></div>';
  try {
    const d = await api('/api?m=release&id='+session+'&sort=episode_asc&page='+page);
    curEps = d.data||[]; totalPages = d.last_page||1; curPage = page;

    document.getElementById('epcnt').textContent = (d.total||curEps.length)+' eps';
    document.getElementById('pglbl').textContent = 'Page '+page+' / '+totalPages;
    document.getElementById('pgprev').disabled = page<=1;
    document.getElementById('pgnext').disabled = page>=totalPages;
    document.getElementById('wmeta').innerHTML = `<span>📺 ${d.total||'?'} episodes</span><span>📡 AnimePahe</span>`;

    if (!curEps.length) { document.getElementById('eplist').innerHTML='<div class="epload">No episodes.</div>'; return; }
    renderEps(curEps);
  } catch(e) {
    document.getElementById('eplist').innerHTML = '<div class="epload">Load failed.</div>';
    toast('Episode load failed','err');
  }
}

function epPage(delta) {
  const np = curPage+delta;
  if (np<1||np>totalPages) return;
  loadEps(curAnime.session, np);
}

function renderEps(eps) {
  document.getElementById('eplist').innerHTML = eps.map((ep,i) =>
    `<div class="epitem" id="ei${i}" onclick="selectEp(${i})">
      ${ep.snapshot?`<img class="epthumb" src="${pImg(ep.snapshot)}" loading="lazy" onerror="this.style.display='none'">`:''}
      <span class="epnum">EP ${ep.episode}</span>
      <span class="epname">${esc(ep.title||'Episode '+ep.episode)}</span>
    </div>`
  ).join('');
}

// ── Select Episode → Fetch Links → Play ───
async function selectEp(i) {
  document.querySelectorAll('.epitem').forEach(e => e.classList.remove('on'));
  const el = document.getElementById('ei'+i);
  if (el) { el.classList.add('on'); el.scrollIntoView({block:'nearest'}); }

  const ep = curEps[i]; if (!ep) return;
  curEpIdx = i;
  toast('Loading EP '+ep.episode+'…');

  try {
    const d = await api('/api?m=links&id='+ep.session);
    const raw = d.data||{};

    curSources = Object.entries(raw)
      .filter(([,info]) => info && info.kwik)
      .map(([q,info]) => ({ quality: parseInt(q)||0, url: info.kwik, audio: info.audio||'jpn' }))
      .sort((a,b) => b.quality - a.quality);

    if (!curSources.length) { fallback(ep); return; }

    playSource(curSources[0], ep.episode);
    renderQBar(curSources, ep.episode);
  } catch(e) {
    console.error(e);
    fallback(ep);
  }
}

function fallback(ep) {
  const url = `${BASE}/play/${curAnime.session}/${ep.session}`;
  toast('No embed found — opening AnimePahe', 'err');
  document.getElementById('wact').innerHTML =
    `<a href="${url}" target="_blank" rel="noopener" class="btnp" style="text-decoration:none">↗ Watch on AnimePahe</a>`;
}

// ── Inject iframe directly — no modal ─────
function playSource(src, epNum) {
  const box = document.getElementById('pbox');
  document.getElementById('pmsg').style.display = 'none';
  const old = box.querySelector('iframe');
  if (old) old.remove();

  const f = document.createElement('iframe');
  f.src = src.url;
  f.setAttribute('allowfullscreen','');
  f.allow = 'autoplay; fullscreen; encrypted-media';
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-presentation');
  f.style.cssText = 'width:100%;height:100%;border:none;display:block;';
  box.appendChild(f);

  document.getElementById('wact').innerHTML =
    `<a href="${esc(src.url)}" target="_blank" rel="noopener" class="btnp" style="text-decoration:none;font-size:12px;padding:8px 16px">↗ Open in New Tab</a>`;

  toast('EP '+epNum+' · '+src.quality+'p', 'ok');
}

// ── Quality switcher bar ──────────────────
function renderQBar(sources, epNum) {
  const bar = document.getElementById('qbar');
  bar.style.display = 'flex';
  bar.innerHTML = '<span class="qlabel">QUALITY:</span>' +
    sources.map((s,i) =>
      `<button class="qbtn${i===0?' on':''}" id="qb${i}" onclick="switchQ(${i},${epNum})">
        ${s.quality}p ${s.audio==='eng'?'🇬🇧':'🇯🇵'}
      </button>`
    ).join('');
}
function switchQ(i, epNum) {
  document.querySelectorAll('.qbtn').forEach((b,j) => b.classList.toggle('on', j===i));
  playSource(curSources[i], epNum);
}

// ── Init ─────────────────────────────────
loadRecent();
</script>
</body>
</html>
